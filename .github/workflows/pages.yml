name: Deploy Portal AOL to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Verify self-contained portal
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f styles.css
          test -f app.js
          test -f data.json
          test -f assets/logo-aol.svg
          test -f assets/leonel.svg
          ! grep -R "curl .*sharepoint" .github index.html styles.css app.js
          ! grep -E 'src="[^"]*sharepoint' index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
