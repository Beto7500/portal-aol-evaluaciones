<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900"><rect width="900" height="900" rx="30" fill="#fff"/><text x="450" y="95" text-anchor="middle" font-family="Arial" font-size="48" font-weight="700" fill="#24201e">Regla de las 3A</text><text x="450" y="140" text-anchor="middle" font-family="Arial" font-size="24" fill="#6f6863">Retroalimentación · Ingeniería AOL</text><g font-family="Arial"><circle cx="210" cy="370" r="135" fill="#fff0e6" stroke="#f36f21" stroke-width="6"/><circle cx="450" cy="370" r="135" fill="#fff0e6" stroke="#f36f21" stroke-width="6"/><circle cx="690" cy="370" r="135" fill="#fff0e6" stroke="#f36f21" stroke-width="6"/><g text-anchor="middle" fill="#c94f0a" font-size="28" font-weight="700"><text x="210" y="360">ACOMPAÑAR</text><text x="450" y="360">ARGUMENTAR</text><text x="690" y="360">ACCIONAR</text></g><g text-anchor="middle" fill="#403a36" font-size="19"><text x="210" y="405">Reconocer el avance</text><text x="450" y="405">Explicar con criterio</text><text x="690" y="405">Indicar el siguiente paso</text></g><text x="90" y="650" font-size="24" font-weight="700" fill="#24201e">Una retroalimentación útil:</text><text x="115" y="700" font-size="22" fill="#403a36">1. Identifica qué está logrado y qué requiere atención.</text><text x="115" y="742" font-size="22" fill="#403a36">2. Sustenta la observación con el criterio académico.</text><text x="115" y="784" font-size="22" fill="#403a36">3. Deja una acción concreta para mejorar o corregir.</text></g></svg>