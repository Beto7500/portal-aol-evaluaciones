<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200"><rect width="900" height="1200" fill="#fff"/><rect width="900" height="125" fill="#f36f21"/><text x="55" y="58" font-family="Arial" font-size="36" font-weight="700" fill="#fff">Guía rápida docente</text><text x="55" y="100" font-family="Arial" font-size="25" fill="#fff">Ingeniería AOL · 202685</text><g font-family="Arial" fill="#222"><text x="55" y="185" font-size="25" font-weight="700">28 septiembre – 1 noviembre 2026</text><text x="55" y="250" font-size="23" font-weight="700">Seguimiento semanal</text><text x="70" y="292" font-size="20">• Lunes: mantener calificaciones actualizadas.</text><text x="70" y="328" font-size="20">• Martes: revisar pendientes e incidencias.</text><text x="70" y="364" font-size="20">• Miércoles: atender dudas y seguimiento.</text><text x="70" y="400" font-size="20">• Domingo 23:00 h: cierre ordinario de entregas.</text><text x="55" y="475" font-size="23" font-weight="700">Sesiones síncronas</text><text x="70" y="517" font-size="20">• Al menos una por semana; grabar la sesión.</text><text x="70" y="553" font-size="20">• Registrar la liga de respaldo en Monday.</text><text x="55" y="628" font-size="23" font-weight="700">Evaluación y originalidad</text><text x="70" y="670" font-size="20">• Retroalimentar con criterios claros y verificables.</text><text x="70" y="706" font-size="20">• Aplicar Turnitin y lineamientos de uso ético de IA.</text><text x="70" y="742" font-size="20">• Evitar calificaciones vacías al cierre.</text><text x="55" y="817" font-size="23" font-weight="700">Incidencias y prórrogas</text><text x="70" y="859" font-size="20">• No prometer extensiones fuera del procedimiento institucional.</text><text x="70" y="895" font-size="20">• Documentar incidencias y dar seguimiento por canales oficiales.</text><text x="55" y="970" font-size="23" font-weight="700">Comunicación</text><text x="70" y="1012" font-size="20">• Responder al alumno en un máximo de 24 h.</text><text x="70" y="1048" font-size="20">• Usar Brightspace y correo institucional.</text></g><text x="55" y="1140" font-family="Arial" font-size="18" fill="#666">Coordinación Académica · Programas de Ingeniería AOL</text></svg>